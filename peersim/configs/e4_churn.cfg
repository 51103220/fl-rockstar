// PeerSim configuration for E4: 10% churn every 50 cycles
// Nodes leave and rejoin with fresh state

random.seed 42
simulation.cycles 1000
network.size 100

protocol.lnk peersim.core.IdleProtocol

init.0 peersim.dynamics.WireKOut
init.0.protocol lnk
init.0.k 10

control.0 peersim.dynamics.KillNodeRandom
control.0.protocol lnk
control.0.n 10
control.0.step 50

control.1 peersim.dynamics.AddNodeDynamic
control.1.protocol lnk
control.1.n 10
control.1.step 50
control.1.delay 50

control.log peersim.reports.GraphStats
control.log.protocol lnk
control.log.step 50
