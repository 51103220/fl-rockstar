// PeerSim configuration for E3: All 5 hubs crash at cycle 100
// Hub re-election triggers automatically via HealControl

random.seed 42
simulation.cycles 1000
network.size 100

protocol.lnk peersim.core.IdleProtocol

init.0 peersim.dynamics.WireKOut
init.0.protocol lnk
init.0.k 10

// Custom HEAL control: marks nodes 0-4 as hubs, crashes them at cycle 100
control.0 HealControl
control.0.protocol lnk
control.0.hub_ids 0,1,2,3,4
control.0.crash_at 100
control.0.step 1
control.0.output_file /data/events/e3_events.json
