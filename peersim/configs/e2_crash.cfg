// PeerSim configuration for E2: 20% random node crash at cycle 100
// Run: java -cp peersim-1.0.5.jar:jep-2.3.0.jar peersim.Simulator peersim/configs/e2_crash.cfg

random.seed 42
simulation.cycles 1000
network.size 100

protocol.lnk peersim.core.IdleProtocol

init.0 peersim.dynamics.WireKOut
init.0.protocol lnk
init.0.k 10

control.0 peersim.dynamics.KillNodeRandom
control.0.at 100
control.0.protocol lnk
control.0.n 20
control.0.step 1

control.log peersim.reports.GraphStats
control.log.protocol lnk
control.log.step 100
