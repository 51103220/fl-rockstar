apiVersion: v1
kind: Secret
metadata:
  name: pull-secret
  namespace: keda
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {
      "auths": {
        "k8srepo.common.repositories.cloud.sap": {
          "username": "${ARTIFACTORY_USER}",
          "password": "${ARTIFACTORY_TOKEN}",
          "auth": ""
        }
      }
    }
