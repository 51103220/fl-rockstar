# Job: pre-split MNIST + Spambase for all 100 nodes, save to PVC
apiVersion: batch/v1
kind: Job
metadata:
  name: heal-gen-data
  namespace: keda
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: artifactory-pull-secret
        - name: dockerhub-pull-secret
      containers:
      - name: gen-data
        image: docker-hub.common.repositories.cloud.sap/library/python:3.11-slim
        command:
        - bash
        - -c
        - |
          apt-get update -qq && apt-get install -y -qq git
          pip install torch torchvision datasets numpy pyyaml scikit-learn --quiet
          git clone https://github.com/51103220/fl-rockstar.git /app
          cd /app && python scripts/gen_data.py \
            --n-nodes 100 \
            --shards 2 \
            --seed 42 \
            --data-dir /data
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
          limits:
            cpu: "8"
            memory: "16Gi"
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: heal-data-pvc
