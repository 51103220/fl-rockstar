apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heal-checkpoints-pvc
  namespace: heal-repro
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heal-results-pvc
  namespace: heal-repro
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heal-data-pvc
  namespace: heal-repro
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
