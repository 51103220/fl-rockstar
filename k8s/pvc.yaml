apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heal-checkpoints-pvc
  namespace: keda
spec:
  storageClassName: files
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heal-results-pvc
  namespace: keda
spec:
  storageClassName: files
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heal-data-pvc
  namespace: keda
spec:
  storageClassName: files
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
