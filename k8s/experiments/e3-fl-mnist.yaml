apiVersion: batch/v1
kind: Job
metadata:
  name: heal-e3-fl-mnist
  namespace: keda
  labels:
    exp: "e3"
    algo: "fl"
    task: "mnist"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: artifactory-pull-secret
        - name: dockerhub-pull-secret
      containers:
      - name: experiment
        image: docker-hub.common.repositories.cloud.sap/library/python:3.11-slim
        command:
        - bash
        - -c
        - |
          apt-get update -qq && apt-get install -y -qq git
          pip install torch torchvision datasets networkx numpy scipy \
            matplotlib seaborn pandas tqdm pyyaml scikit-learn --quiet
          git clone https://github.com/51103220/fl-rockstar.git /app
          cd /app
          python scripts/run_experiment.py \
            --exp e3 \
            --algo fl \
            --task mnist \
            --n-nodes 100 \
            --n-cycles 1000 \
            --seed 42 \
            --data-dir /data \
            --ckpt-dir /checkpoints/e3/fl/mnist \
            --results-dir /results
        resources:
          requests:
            cpu: "2"
            memory: "16Gi"
          limits:
            cpu: "2"
            memory: "16Gi"
        volumeMounts:
        - name: data
          mountPath: /data
          readOnly: true
        - name: checkpoints
          mountPath: /checkpoints
        - name: results
          mountPath: /results
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: heal-data-pvc
      - name: checkpoints
        persistentVolumeClaim:
          claimName: heal-checkpoints-pvc
      - name: results
        persistentVolumeClaim:
          claimName: heal-results-pvc
