apiVersion: batch/v1
kind: Job
metadata:
  name: fl-rockstar-gpu
  labels:
    app: fl-rockstar
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: gcr.io/YOUR_PROJECT/fl-rockstar:latest
          command: ["python", "scripts/run_experiments.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /workspace
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: results
              mountPath: /workspace/results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: fl-rockstar-results-pvc
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-t4
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
